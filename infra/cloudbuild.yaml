# Cloud Build CI/CD — builds and deploys both Cloud Run services

steps:
  # Run tests first
  - name: python:3.12-slim
    entrypoint: bash
    args:
      - -c
      - |
        pip install -r requirements.txt pytest pytest-asyncio
        python -m pytest tests/ -v

  # Build subscriber image
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/tributary-subscriber:$COMMIT_SHA
      - -f
      - Dockerfile.subscriber
      - .

  # Build aggregator image
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/tributary-aggregator:$COMMIT_SHA
      - -f
      - Dockerfile.aggregator
      - .

  # Push images
  - name: gcr.io/cloud-builders/docker
    args: [push, gcr.io/$PROJECT_ID/tributary-subscriber:$COMMIT_SHA]
  - name: gcr.io/cloud-builders/docker
    args: [push, gcr.io/$PROJECT_ID/tributary-aggregator:$COMMIT_SHA]

  # Deploy subscriber
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - tributary-subscriber
      - --image=gcr.io/$PROJECT_ID/tributary-subscriber:$COMMIT_SHA
      - --region=us-central1
      - --platform=managed

  # Deploy aggregator
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - tributary-aggregator
      - --image=gcr.io/$PROJECT_ID/tributary-aggregator:$COMMIT_SHA
      - --region=us-central1
      - --platform=managed

images:
  - gcr.io/$PROJECT_ID/tributary-subscriber:$COMMIT_SHA
  - gcr.io/$PROJECT_ID/tributary-aggregator:$COMMIT_SHA
